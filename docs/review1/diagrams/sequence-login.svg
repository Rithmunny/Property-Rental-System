<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Calibri, Arial, sans-serif">
  <rect width="960" height="380" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700">Figure 12.3  Sequence: tenant login (role from database)</text>
  <text x="120" y="70" text-anchor="middle" font-size="12" font-weight="700">Login.jsx</text>
  <text x="340" y="70" text-anchor="middle" font-size="12" font-weight="700">auth.js adapter</text>
  <text x="560" y="70" text-anchor="middle" font-size="12" font-weight="700">Supabase Auth</text>
  <text x="780" y="70" text-anchor="middle" font-size="12" font-weight="700">profiles table</text>
  <line x1="120" y1="80" x2="120" y2="340" stroke="#999"/>
  <line x1="340" y1="80" x2="340" y2="340" stroke="#999"/>
  <line x1="560" y1="80" x2="560" y2="340" stroke="#999"/>
  <line x1="780" y1="80" x2="780" y2="340" stroke="#999"/>
  <line x1="120" y1="120" x2="340" y2="120" stroke="#1f3a5f" marker-end="url(#b)"/>
  <text x="230" y="112" text-anchor="middle" font-size="11">1. email + password</text>
  <line x1="340" y1="160" x2="560" y2="160" stroke="#1f3a5f" marker-end="url(#b)"/>
  <text x="450" y="152" text-anchor="middle" font-size="11">2. signInWithPassword</text>
  <line x1="560" y1="200" x2="340" y2="200" stroke="#1f3a5f" marker-end="url(#b)"/>
  <text x="450" y="192" text-anchor="middle" font-size="11">3. JWT session or error</text>
  <line x1="340" y1="240" x2="780" y2="240" stroke="#1f3a5f" marker-end="url(#b)"/>
  <text x="560" y="232" text-anchor="middle" font-size="11">4. SELECT role FROM profiles WHERE id = auth.uid()</text>
  <line x1="780" y1="280" x2="120" y2="280" stroke="#1f3a5f" marker-end="url(#b)"/>
  <text x="450" y="272" text-anchor="middle" font-size="11">5. {user, token}  role is never chosen on the login form</text>
  <text x="480" y="360" text-anchor="middle" font-size="12" fill="#333">Admin is not self-registerable. Wrong password returns 401. RequireRole then routes to the matching dashboard.</text>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f3a5f"/></marker>
  </defs>
</svg>
