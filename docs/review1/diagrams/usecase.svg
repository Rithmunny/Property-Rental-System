<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Calibri, Arial, sans-serif">
  <rect width="1000" height="640" fill="#fff"/>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="700">Figure 9.1  Use-case diagram</text>
  <rect x="150" y="48" width="700" height="560" rx="10" fill="none" stroke="#1f3a5f"/>
  <text x="500" y="72" text-anchor="middle" font-size="13" font-weight="700">Property Rental System</text>

  <!-- Tenant stick -->
  <circle cx="60" cy="180" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="192" x2="60" y2="240" stroke="#111" stroke-width="2"/>
  <line x1="40" y1="210" x2="80" y2="210" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="240" x2="42" y2="280" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="240" x2="78" y2="280" stroke="#111" stroke-width="2"/>
  <text x="60" y="304" text-anchor="middle" font-size="12" font-weight="700">Tenant</text>

  <!-- Landlord -->
  <circle cx="60" cy="400" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="412" x2="60" y2="460" stroke="#111" stroke-width="2"/>
  <line x1="40" y1="430" x2="80" y2="430" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="460" x2="42" y2="500" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="460" x2="78" y2="500" stroke="#111" stroke-width="2"/>
  <text x="60" y="524" text-anchor="middle" font-size="12" font-weight="700">Landlord</text>

  <!-- Admin -->
  <circle cx="940" cy="300" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="940" y1="312" x2="940" y2="360" stroke="#111" stroke-width="2"/>
  <line x1="920" y1="330" x2="960" y2="330" stroke="#111" stroke-width="2"/>
  <line x1="940" y1="360" x2="922" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="940" y1="360" x2="958" y2="400" stroke="#111" stroke-width="2"/>
  <text x="940" y="424" text-anchor="middle" font-size="12" font-weight="700">Admin</text>

  <!-- Use cases -->
  <g font-size="11" text-anchor="middle">
    <ellipse cx="320" cy="120" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="320" y="124">Register / log in</text>
    <ellipse cx="500" cy="120" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="500" y="124">Search and filter listings</text>
    <ellipse cx="320" cy="190" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="320" y="194">View property details</text>
    <ellipse cx="500" cy="190" rx="120" ry="28" fill="#e8f1ea" stroke="#1f3a5f" stroke-width="2"/>
    <text x="500" y="194">Request to rent (demo UC)</text>
    <ellipse cx="320" cy="260" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="320" y="264">Request a viewing</text>
    <ellipse cx="500" cy="260" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="500" y="264">Save / unsave listing</text>
    <ellipse cx="320" cy="330" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="320" y="334">Track request status</text>
    <ellipse cx="680" cy="190" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="680" y="194">Manage listings (CRUD)</text>
    <ellipse cx="680" cy="260" rx="120" ry="28" fill="#e8f1ea" stroke="#1f3a5f" stroke-width="2"/>
    <text x="680" y="264">Accept / decline request</text>
    <ellipse cx="680" cy="330" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="680" y="334">Record contract stub</text>
    <ellipse cx="680" cy="400" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="680" y="404">Moderate users / listings</text>
    <ellipse cx="500" cy="400" rx="110" ry="28" fill="#fff6e8" stroke="#1f3a5f" stroke-dasharray="4 3"/>
    <text x="500" y="396">Pay booking (sandbox)</text>
    <text x="500" y="410" font-size="9" fill="#555">Should  after Review 1</text>
    <ellipse cx="320" cy="470" rx="110" ry="28" fill="#fff6e8" stroke="#1f3a5f" stroke-dasharray="4 3"/>
    <text x="320" y="466">AI recommendations</text>
    <text x="320" y="480" font-size="9" fill="#555">Must this semester / later sprint</text>
    <ellipse cx="500" cy="470" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="500" y="474">Submit review / rating</text>
    <ellipse cx="680" cy="470" rx="110" ry="28" fill="#f4f7fb" stroke="#1f3a5f"/>
    <text x="680" y="474">View analytics</text>
  </g>

  <line x1="78" y1="180" x2="210" y2="120" stroke="#333"/>
  <line x1="78" y1="185" x2="390" y2="190" stroke="#333"/>
  <line x1="78" y1="190" x2="380" y2="260" stroke="#333"/>
  <line x1="78" y1="200" x2="210" y2="330" stroke="#333"/>
  <line x1="78" y1="210" x2="390" y2="120" stroke="#333"/>
  <line x1="78" y1="220" x2="390" y2="260" stroke="#333"/>
  <line x1="78" y1="400" x2="210" y2="120" stroke="#333"/>
  <line x1="82" y1="410" x2="560" y2="190" stroke="#333"/>
  <line x1="82" y1="420" x2="560" y2="260" stroke="#333"/>
  <line x1="82" y1="430" x2="570" y2="330" stroke="#333"/>
  <line x1="918" y1="300" x2="790" y2="120" stroke="#333"/>
  <line x1="918" y1="310" x2="790" y2="400" stroke="#333"/>
  <line x1="918" y1="320" x2="790" y2="470" stroke="#333"/>
</svg>
