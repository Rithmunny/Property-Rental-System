<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Calibri, Arial, sans-serif">
  <rect width="980" height="620" fill="#fff"/>
  <text x="490" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Figure 10.1  System architecture (Review 1)</text>

  <!-- Users -->
  <rect x="30" y="60" width="140" height="150" rx="8" fill="#f4f7fb" stroke="#1f3a5f"/>
  <text x="100" y="88" text-anchor="middle" font-size="13" font-weight="700">Users</text>
  <text x="100" y="118" text-anchor="middle" font-size="12">Tenant</text>
  <text x="100" y="142" text-anchor="middle" font-size="12">Landlord</text>
  <text x="100" y="166" text-anchor="middle" font-size="12">Administrator</text>

  <!-- Frontend -->
  <rect x="220" y="60" width="230" height="150" rx="8" fill="#e8f1ea" stroke="#1f3a5f"/>
  <text x="335" y="88" text-anchor="middle" font-size="13" font-weight="700">Presentation layer</text>
  <text x="335" y="118" text-anchor="middle" font-size="12">Vite + React 19 SPA</text>
  <text x="335" y="142" text-anchor="middle" font-size="12">Tailwind CSS / role dashboards</text>
  <text x="335" y="166" text-anchor="middle" font-size="12">API adapters (frontend/src/api)</text>

  <!-- Backend BaaS -->
  <rect x="500" y="50" width="250" height="250" rx="8" fill="#fff6e8" stroke="#1f3a5f"/>
  <text x="625" y="78" text-anchor="middle" font-size="13" font-weight="700">Backend services (Supabase)</text>
  <rect x="520" y="98" width="210" height="44" rx="6" fill="#fff" stroke="#5a6b7d"/>
  <text x="625" y="126" text-anchor="middle" font-size="12">Supabase Auth (JWT)</text>
  <rect x="520" y="154" width="210" height="44" rx="6" fill="#fff" stroke="#5a6b7d"/>
  <text x="625" y="182" text-anchor="middle" font-size="12">PostgreSQL + Row Level Security</text>
  <rect x="520" y="210" width="210" height="44" rx="6" fill="#fff" stroke="#5a6b7d"/>
  <text x="625" y="238" text-anchor="middle" font-size="12">Storage (photos, later)</text>
  <text x="625" y="278" text-anchor="middle" font-size="11" fill="#444">PostgREST API / RLS policies</text>

  <!-- External future -->
  <rect x="790" y="60" width="160" height="230" rx="8" fill="#f7f0f4" stroke="#1f3a5f" stroke-dasharray="5 4"/>
  <text x="870" y="88" text-anchor="middle" font-size="13" font-weight="700">Planned adapters</text>
  <text x="870" y="122" text-anchor="middle" font-size="12">ABA PayWay / Stripe</text>
  <text x="870" y="146" text-anchor="middle" font-size="11">(sandbox, after Review 1)</text>
  <text x="870" y="180" text-anchor="middle" font-size="12">OpenAI / Gemini</text>
  <text x="870" y="204" text-anchor="middle" font-size="11">(recommendations)</text>
  <text x="870" y="238" text-anchor="middle" font-size="12">Leaflet / OSM maps</text>
  <text x="870" y="262" text-anchor="middle" font-size="11">(already in UI)</text>

  <!-- Data stores -->
  <rect x="220" y="340" width="530" height="120" rx="8" fill="#eef3f8" stroke="#1f3a5f"/>
  <text x="485" y="368" text-anchor="middle" font-size="13" font-weight="700">PostgreSQL tables (Review 1 foundation)</text>
  <text x="485" y="398" text-anchor="middle" font-size="12">profiles · properties · rental_requests · contracts · saved_properties</text>
  <text x="485" y="424" text-anchor="middle" font-size="12">Later: payments · reviews · messages · analytics views</text>

  <!-- Arrows -->
  <line x1="170" y1="135" x2="220" y2="135" stroke="#1f3a5f" marker-end="url(#arr)"/>
  <line x1="450" y1="135" x2="500" y2="135" stroke="#1f3a5f" marker-end="url(#arr)"/>
  <line x1="750" y1="160" x2="790" y2="160" stroke="#1f3a5f" stroke-dasharray="5 4"/>
  <line x1="625" y1="300" x2="625" y2="340" stroke="#1f3a5f" marker-end="url(#arr)"/>
  <line x1="335" y1="210" x2="335" y2="340" stroke="#1f3a5f" marker-end="url(#arr)"/>

  <text x="490" y="500" text-anchor="middle" font-size="12" fill="#333">HTTPS JSON (JWT). Mock localStorage remains a development fallback (VITE_USE_MOCK).</text>
  <text x="490" y="524" text-anchor="middle" font-size="12" fill="#333">Review 1 demo path: SPA ’ Auth ’ rental_requests row ’ landlord accept ’ UI refresh from PostgreSQL.</text>
  <text x="490" y="560" text-anchor="middle" font-size="11" fill="#555">Correction from proposal: presentation layer is Vite + React rather than Next.js. Database and auth remain Supabase/PostgreSQL as approved.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f3a5f"/>
    </marker>
  </defs>
</svg>
